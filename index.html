<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crownline: Prologue</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="title" id="gameTitle">Crownline: Prologue</div>
          <div class="subtitle" id="gameSubtitle">A royal dossier recovered from the ruins</div>
        </div>

        <div class="topActions">
          <button class="ghost" id="resetBtn">Reset</button>
        </div>
      </header>

      <main class="layout">
        <!-- Left: Scene -->
        <section class="scene">
          <div class="sceneHeader">
            <div class="sceneTitle" id="sceneTitle">Scene</div>
            <div class="stamp" id="stamp">STAMP</div>
          </div>

          <div class="sceneMedia">
            <img id="sceneImage" src="" alt="Scene image" />
          </div>

          <div class="sceneBody" id="bodyText"></div>

          <div class="proceed" id="proceedWrap"></div>
        </section>

        <!-- Right: Dossier sidebar -->
        <aside class="dossier">
          <div class="panel">
            <div class="panelTitle">Hotspots</div>
            <div class="panelBody">
              <div class="hotspots" id="hotspotList"></div>
            </div>
          </div>

          <div class="panel">
            <div class="panelTitle">Clues</div>
            <div class="panelBody">
              <div class="muted" id="cluesEmpty">No clues filed yet.</div>
              <div class="chips" id="clueChips"></div>
            </div>
          </div>

          <div class="panel">
            <div class="panelTitle">Hidden Lore Pages</div>
            <div class="panelBody">
              <div class="loreList" id="loreList"></div>
            </div>
          </div>
        </aside>
      </main>

      <!-- Modal -->
      <div class="modal" id="modal">
        <div class="backdrop" id="modalBackdrop"></div>
        <div class="sheet">
          <div class="sheetHeader">
            <div class="sheetTitle" id="modalTitle">Title</div>
            <button class="ghost" id="closeModal">Close</button>
          </div>
          <div class="sheetBody" id="modalBody"></div>
          <div class="sheetChoices" id="modalChoices"></div>
          <div class="sheetFooter" id="modalFooter"></div>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
